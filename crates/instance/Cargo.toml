[package]
name = "nodus-instance"
description = "Mastodon compatibility in one crate: the protocol model, the instance surface as traits, and the REST transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"], optional = true }
gloo-net = { version = "0.6", default-features = false, features = ["http"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "BinaryType",
    "MessageEvent",
    "WebSocket",
] }

[features]
# The `reqwest` transport, for native builds (the calculator, the sync worker).
native = ["dep:reqwest"]
# The browser transport; only built for `wasm32`.
wasm = ["dep:gloo-net", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[lints]
workspace = true
