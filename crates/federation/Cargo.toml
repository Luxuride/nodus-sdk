[package]
name = "nodus-federation"
description = "ActivityPub federation: activities, HTTP signatures, delivery and inbox policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:reqwest"]

[dependencies]
nodus-activitypub-sdk = { workspace = true, features = ["read"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
