[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/instance-model",
    "crates/instance-api",
    "crates/instance-rest",
    "crates/discovery",
    "crates/persist",
    "crates/state",
    "crates/runtime",
    "crates/sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/nodus-social/nodus-sdk"

[workspace.dependencies]
nodus-shared = { path = "crates/shared", version = "0.1.0" }
nodus-instance-model = { path = "crates/instance-model", version = "0.1.0" }
nodus-instance-api = { path = "crates/instance-api", version = "0.1.0" }
nodus-instance-rest = { path = "crates/instance-rest", version = "0.1.0" }
nodus-discovery = { path = "crates/discovery", version = "0.1.0" }
nodus-persist = { path = "crates/persist", version = "0.1.0" }
nodus-state = { path = "crates/state", version = "0.1.0" }
nodus-runtime = { path = "crates/runtime", version = "0.1.0" }
nodus-sdk = { path = "crates/sdk", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
