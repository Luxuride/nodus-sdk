[workspace]
resolver = "3"
members = ["crates/shared", "crates/mastodon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/luxuride/mastodon-reccom-sdk"

[workspace.dependencies]
mastodon-reccom-shared = { path = "crates/shared", version = "0.1.0" }
mastodon-reccom-mastodon = { path = "crates/mastodon", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
